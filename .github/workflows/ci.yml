name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-24.04
    # Bootstrap permits 25 minutes of bounded install work; verify-all owns a
    # 48-minute deadline. Keep finalization and always-upload outside both.
    timeout-minutes: 90
    env:
      CI: "true"
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Bootstrap the locked toolchain and supported browsers
        run: npm run bootstrap

      - name: Run the complete verification contract
        run: npm run verify-all

      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/**
            coverage/**
            playwright-report/**
            test-results/**
            dist/**
            .dev/logs/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
